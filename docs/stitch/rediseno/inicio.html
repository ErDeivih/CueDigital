<!-- Script accesible para aumentar tamaño de texto -->
<script>
    const textToggle = document.querySelector('button[aria-label="Aumentar tamaño de texto"]');
    let isEnlarged = false;
    textToggle?.addEventListener('click', () => {
      isEnlarged = !isEnlarged;
      if (isEnlarged) {
        document.documentElement.style.fontSize = '120%';
        textToggle.classList.add('bg-focus', 'text-on-surface');
      } else {
        document.documentElement.style.fontSize = '100%';
        textToggle.classList.remove('bg-focus', 'text-on-surface');
      }
    });
  </script>
