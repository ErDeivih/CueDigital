[tool.pytest.ini_options]
# `pythonpath = ["."]` es lo que permite que los tests hagan `from app import ...`
# sin obligar a instalar el paquete. Se lanzan desde la carpeta `backend`.
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.ruff]
line-length = 100
target-version = "py312"
