<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <!-- Sin `user-scalable=no` a propósito: quien ve poco tiene que poder ampliar. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f4a2c">
  <meta name="description" content="El cuaderno de campo, en el móvil y en castellano.">
  <title>CUE Digital</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/estilos.css">
  <link rel="icon" type="image/svg+xml" href="/marca.svg">
</head>
<body>
  <!-- Lo que queda pendiente de mandar. Va arriba y se ve siempre, porque el
       agricultor tiene que saber que lo que apuntó sin cobertura NO se ha perdido. -->
  <div id="aviso-pendientes" class="aviso oculto" role="status" aria-live="polite"></div>

  <!-- ***Lo que no se ha podido cargar*** (21/10/2026, D03): *un fallo de la red **no es «no hay datos»**.
       Va arriba y se ve siempre, con su boton de reintentar, para que el agricultor no lea «0 facturas» cuando
       lo que pasa es que no se ha podido preguntar.* -->
  <div id="aviso-cargas" class="aviso oculto" role="status" aria-live="polite"></div>

  <!-- El armazón de la aplicación en el ordenador: el menú de la izquierda y la barra de arriba
       (la finca, el año, la cuenta y el botón de apuntar). Lo pinta React (`react/piezas/marco.js`) y
       **en el móvil no se ve**: en una pantalla estrecha manda el CSS y ahí se sigue entrando por la
       pantalla de inicio, que es lo que el agricultor ya conoce. -->
  <div id="marco" class="marco"></div>

  <header class="cabecera">
    <!-- **El menú cuando no cabe a la izquierda** (07/10/2026). Por debajo de 64 rem el armazón se esconde
         —es de ordenador— y con él se iban los 21 renglones: medido, a 712 px no había forma de llegar a
         las cuentas con el teclado. Este botón lo abre encima de la pantalla. En el ordenador no se ve: allí
         el menú está siempre a la izquierda y un botón para abrirlo sería un botón de más. -->
    <button type="button" class="cabecera-menu boton-letra" data-accion="menu-abrir"
            aria-label="Abrir el menú de la aplicación" aria-controls="marco" aria-expanded="false">
      <span aria-hidden="true">☰</span>
      <span id="cabecera-menu-texto">Menú</span>
    </button>
    <button type="button" class="cabecera-titulo" data-accion="ir-inicio">
      <img class="marca-simbolo" src="/marca.svg" width="28" height="28" alt="" aria-hidden="true">
      <span id="cabecera-texto">CUE Digital</span>
    </button>
    <div class="cabecera-botones">
      <button type="button" class="boton-letra" data-accion="cambiar-letra"
              aria-label="Poner la letra más grande">A+</button>
      <button type="button" class="boton-letra" data-accion="salir"
              aria-label="Salir de la cuenta">Salir</button>
    </div>
  </header>

  <main id="pantalla" class="pantalla" aria-live="polite"></main>

  <p id="pie" class="pie"></p>

  <!-- React, sin compilar. Son ficheros oficiales descargados a `web/vendor/` (con su
       licencia y su LEEME): no hay npm ni paso de compilación, porque donde corre esto no
       hay Node y la aplicación tiene que abrirse en el campo sin cobertura. `htm` es lo
       que deja escribir las plantillas sin JSX. Van ANTES de `app.js`: si no, el módulo no
       encuentra `React` y `htm` cuando se cargue. -->
  <script src="/vendor/react.production.min.js"></script>
  <script src="/vendor/react-dom.production.min.js"></script>
  <script src="/vendor/htm.umd.js"></script>

  <script type="module" src="/app.js"></script>
</body>
</html>
